# =============================================================================
# Exemple de configuration Apache HTTPD - Reverse proxy pour l'application
# de transcription audio.
#
# Required Apache modules:
#   sudo a2enmod proxy proxy_http ssl headers rewrite
#
# This file assumes the "frontend" container (docker-compose) is exposed
# on the host, locally only (127.0.0.1), through the port defined by
# FRONTEND_HOST_PORT in .env (8080 by default — see docker-compose.yml).
# The frontend itself proxies /api to the backend on the internal Docker
# network: Apache therefore has only one upstream service to target.
#
# Adapter avant mise en production :
#   - transcription.example.com: the real domain name
#   - Let's Encrypt certificate paths (generated via certbot)
#   - upstream port (8080) if FRONTEND_HOST_PORT was changed in .env
#   - LimitRequestBody: must be >= the file size limit configured in
#     the admin panel (in bytes; see note below)
# =============================================================================

# --- Redirection HTTP -> HTTPS ---
<VirtualHost *:80>
    ServerName transcription.example.com

    # Utile pour le renouvellement automatique de certificat en mode
    # webroot (certbot). Si vous utilisez le plugin --apache, cette section
    # can be handled automatically by certbot.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/transcription_error.log
    CustomLog ${APACHE_LOG_DIR}/transcription_access.log combined
</VirtualHost>

# --- VirtualHost HTTPS ---
<VirtualHost *:443>
    ServerName transcription.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/transcription.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/transcription.example.com/privkey.pem

    # Modern TLS configuration (Mozilla SSL Config Generator reference,
    # "intermediate" profile). Adapt to the browsers/clients to support.
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # OCSP Stapling (speeds up and hardens certificate validation on the
    # client side). Requires the ssl_stapling cache configured globally
    # in ssl.conf (often enabled by default on Debian/Ubuntu):
    #   SSLUseStapling On
    #   SSLStaplingCache "shmcb:/var/run/apache2/stapling_cache(128000)"
    SSLUseStapling on

    # --- Max request size (audio upload) ---
    # MUST be >= the "Max size (MB)" limit configured in the
    # panneau d'administration de l'application (Limites d'upload). Cette
    # Apache limit is an upstream safeguard; the actually enforced limit
    # (with a clear error message) remains the application's.
    # Valeur ci-dessous : 300 Mo = 300 * 1024 * 1024 octets.
    LimitRequestBody 314572800

    # --- Security headers ---
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    ProxyPreserveHost On
    ProxyRequests Off

    # Timeouts raised as a precaution: uploading a large audio file
    # peut prendre du temps sur une connexion lente. Le traitement de
    # transcription itself is asynchronous on the backend side (the worker
    # processes in the background), so this value only covers the HTTP
    # upload duration, not the transcription duration.
    ProxyTimeout 300
    TimeOut 300

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog  ${APACHE_LOG_DIR}/transcription_error.log
    CustomLog ${APACHE_LOG_DIR}/transcription_access.log combined
</VirtualHost>
