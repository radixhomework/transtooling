server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React application (SPA): any unknown route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend proxies /api to the backend on the internal Docker
    # network. The external Apache reverse proxy therefore only needs to
    # route to this frontend container over HTTPS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large audio file uploads. This value must stay consistent
        # with:
        #   - LimitRequestBody in reverse-proxy/apache-transcription.conf
        #   - the "Max size (MB)" limit defined in the application's admin
        #     panel (Upload limits)
        # Example here for 300 MB (default value aligned with the provided
        # Apache example).
        client_max_body_size 300M;
    }
}
