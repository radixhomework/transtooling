# =============================================================================
# Exemple de configuration Apache HTTPD - Reverse proxy pour l'application
# de transcription audio.
#
# Prérequis modules Apache :
#   sudo a2enmod proxy proxy_http ssl headers rewrite
#
# Ce fichier suppose que le conteneur "frontend" (docker-compose) est exposé
# sur l'hôte, en local uniquement (127.0.0.1), via le port défini par
# FRONTEND_HOST_PORT dans .env (8080 par défaut — voir docker-compose.yml).
# Le frontend proxifie lui-même /api vers le backend en interne au réseau
# Docker : Apache n'a donc qu'un seul service en aval à cibler.
#
# Adapter avant mise en production :
#   - transcription.example.com : nom de domaine réel
#   - chemins des certificats Let's Encrypt (générés via certbot)
#   - port amont (8080) si FRONTEND_HOST_PORT a été changé dans .env
#   - LimitRequestBody : doit être >= à la limite de taille de fichier
#     configurée dans le panneau admin (en octets ; voir note plus bas)
# =============================================================================

# --- Redirection HTTP -> HTTPS ---
<VirtualHost *:80>
    ServerName transcription.example.com

    # Utile pour le renouvellement automatique de certificat en mode
    # webroot (certbot). Si vous utilisez le plugin --apache, cette section
    # peut être gérée automatiquement par certbot.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/transcription_error.log
    CustomLog ${APACHE_LOG_DIR}/transcription_access.log combined
</VirtualHost>

# --- VirtualHost HTTPS ---
<VirtualHost *:443>
    ServerName transcription.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/transcription.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/transcription.example.com/privkey.pem

    # Configuration TLS moderne (référence Mozilla SSL Config Generator,
    # profil "intermediate"). Adapter selon les navigateurs/clients à
    # supporter.
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # OCSP Stapling (accélère et fiabilise la validation du certificat côté
    # client). Nécessite le cache ssl_stapling configuré globalement dans
    # ssl.conf (souvent activé par défaut sur Debian/Ubuntu) :
    #   SSLUseStapling On
    #   SSLStaplingCache "shmcb:/var/run/apache2/stapling_cache(128000)"
    SSLUseStapling on

    # --- Taille maximale des requêtes (upload audio) ---
    # DOIT être >= à la limite "Taille maximale (Mo)" configurée dans le
    # panneau d'administration de l'application (Limites d'upload). Cette
    # limite Apache est un garde-fou en amont ; la limite réellement
    # appliquée (avec message d'erreur clair) reste celle de l'application.
    # Valeur ci-dessous : 300 Mo = 300 * 1024 * 1024 octets.
    LimitRequestBody 314572800

    # --- Headers de sécurité ---
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    ProxyPreserveHost On
    ProxyRequests Off

    # Timeouts augmentés par prudence : l'upload d'un fichier audio volumineux
    # peut prendre du temps sur une connexion lente. Le traitement de
    # transcription lui-même est asynchrone côté backend (le worker traite en
    # tâche de fond), donc cette valeur ne concerne que la durée de l'upload
    # HTTP, pas la durée de la transcription.
    ProxyTimeout 300
    TimeOut 300

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog  ${APACHE_LOG_DIR}/transcription_error.log
    CustomLog ${APACHE_LOG_DIR}/transcription_access.log combined
</VirtualHost>
