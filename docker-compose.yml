name: transtooling

services:
  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    environment:
      - SQLITE_PATH=${SQLITE_PATH:-/data/app.db}
      - AUDIO_TMP_PATH=${AUDIO_TMP_PATH:-/audio_tmp}
      - TRANSCRIPTS_PATH=${TRANSCRIPTS_PATH:-/transcripts}
      - WHISPER_MODELS_PATH=${WHISPER_MODELS_PATH:-/models}
      - TRANSLATION_TMP_PATH=${TRANSLATION_TMP_PATH:-/translation_tmp}
      - TRANSLATIONS_PATH=${TRANSLATIONS_PATH:-/translations}
      - ADMIN_LOGIN=${ADMIN_LOGIN:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_before_deploying}
    volumes:
      - db_data:/data
      - audio_tmp:/audio_tmp
      - transcripts_data:/transcripts
      - whisper_models_data:/models
      - translation_tmp:/translation_tmp
      - translations_data:/translations
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  transcription-worker:
    build:
      context: transcription-worker
    container_name: transcription-worker
    restart: unless-stopped
    environment:
      - SQLITE_PATH=${SQLITE_PATH:-/data/app.db}
      - AUDIO_TMP_PATH=${AUDIO_TMP_PATH:-/audio_tmp}
      - TRANSCRIPTS_PATH=${TRANSCRIPTS_PATH:-/transcripts}
      - WHISPER_MODELS_PATH=${WHISPER_MODELS_PATH:-/models}
    volumes:
      - db_data:/data
      - audio_tmp:/audio_tmp
      - transcripts_data:/transcripts
      - whisper_models_data:/models
    depends_on:
      backend:
        condition: service_healthy

  translation-worker:
    build:
      context: ./translation-worker
    container_name: translation-worker
    restart: unless-stopped
    environment:
      - SQLITE_PATH=${SQLITE_PATH:-/data/app.db}
      - TRANSLATION_MODELS_PATH=${TRANSLATION_MODELS_PATH:-/translation_models}
      - TRANSLATION_TMP_PATH=${TRANSLATION_TMP_PATH:-/translation_tmp}
      - TRANSLATIONS_PATH=${TRANSLATIONS_PATH:-/translations}
    volumes:
      - db_data:/data
      - translation_tmp:/translation_tmp
      - translations_data:/translations
      - translation_models_data:/translation_models
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=/api
    container_name: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT}:80"

volumes:
  db_data:
  audio_tmp:
  transcripts_data:
  whisper_models_data:
  translation_models_data:
  translation_tmp:
  translations_data:
