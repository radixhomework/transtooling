server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application React (SPA) : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le frontend proxifie /api vers le backend au sein du réseau Docker
    # interne. Le reverse proxy Apache externe n'a donc besoin de router
    # que vers ce conteneur frontend en HTTPS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Autoriser l'upload de fichiers audio volumineux. Cette valeur doit
        # rester cohérente avec :
        #   - LimitRequestBody dans reverse-proxy/apache-transcription.conf
        #   - la limite "Taille maximale (Mo)" définie dans le panneau
        #     d'administration de l'application (Limites d'upload)
        # Exemple ici pour 300 Mo (valeur par défaut alignée avec l'exemple
        # Apache fourni).
        client_max_body_size 300M;
    }
}
